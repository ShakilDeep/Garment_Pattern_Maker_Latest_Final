[package]
name = "patternforge"
version = "0.1.0"
edition = "2021"
description = "Parametric garment pattern drafting, grading, DXF-AAMA export and cloth drape core (zero dependencies)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pf"
path = "src/bin/pf.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
