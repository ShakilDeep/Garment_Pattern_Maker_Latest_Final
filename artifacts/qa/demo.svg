<svg xmlns="http://www.w3.org/2000/svg" width="1700mm" height="1927.5mm" viewBox="0 0 170 192.75"><title>Demo shirt pattern; calibration required</title><metadata>{&quot;profile&quot;: &quot;mens_regular_long_sleeve_shirt_demo_v1&quot;, &quot;hash&quot;: &quot;d5fa107c55064183dd11c65950a12baeafd54cffe6a373d5954df146ba959bd4&quot;, &quot;assumptions&quot;: [&quot;Demo profile only; client base blocks and physical sample calibration are not supplied.&quot;, &quot;Body widths allocate half of each flat half-body measurement to each front/back half.&quot;, &quot;Source shoulder-to-cuff sleeve length includes cuff; sleeve body subtracts cuff width.&quot;, &quot;Curves use sampled quadratic construction with 24 segments; no shrinkage or additional ease.&quot;, &quot;Back neck drop is 2 cm. Collar attachment follows generated neckline, not a certified collar block.&quot;, &quot;Front placket is a center-front extension using the explicitly resolved source width.&quot;, &quot;Collar point and center-back height use source values; buttoned length and outside edge are checked against source as calibration targets.&quot;, &quot;Back and yoke are unfolded before nesting. Grain follows the vertical piece axis; no rotation.&quot;, &quot;Seam allowance defaults to zero. Positive allowance is a polygon offset, not a manufacturing standard.&quot;, &quot;Pocket omitted because no pocket dimensions are supplied. Sleeve cap mismatch remains a visible warning.&quot;, &quot;Demo v1 shortens back/yoke half-shoulder by max(0, forward_shoulder_armhole - forward_shoulder_neck); not a client block.&quot;, &quot;Demo v1 places sleeve placket/pleat notches on the outline from source lengths; not a construction block.&quot;]}</metadata><g id="front" transform="translate(5,12)"><polygon points="2.9860,8.6500 -1.0000,8.6500 -1.0000,76.5000 2.9720,76.5000 4.3143,76.5751 5.6703,76.6380 7.0075,76.6870 8.3259,76.7220 9.6255,76.7430 10.9063,76.7500 12.1684,76.7430 13.4117,76.7220 14.6362,76.6869 15.842