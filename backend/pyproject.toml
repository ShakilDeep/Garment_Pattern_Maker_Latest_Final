[project]
name = "garment-pattern-maker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "pydantic>=2.0", "python-multipart>=0.0.20", "openpyxl>=3.1", "pdfplumber>=0.11", "reportlab>=4.0", "shapely>=2.0"]
[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "mypy", "pip-audit"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
